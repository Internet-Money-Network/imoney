<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>

    <!-- Electric Emerald Core Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58f187"/>
      <stop offset="50%" stop-color="#23c85e"/>
      <stop offset="100%" stop-color="#0e803c"/>
    </linearGradient>

    <!-- Cyber Blue Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circular Coin Shield -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#238636" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="12 8" stroke-opacity="0.6"/>

  <!-- BlockDAG Lattice Network Connections (Directed Acyclic Graph) -->
  <g stroke="#58a6ff" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="4 4">
    <!-- Outer perimeter connections -->
    <line x1="256" y1="70" x2="410" y2="155"/>
    <line x1="410" y1="155" x2="410" y2="355"/>
    <line x1="410" y1="355" x2="256" y2="442"/>
    <line x1="256" y1="442" x2="102" y2="355"/>
    <line x1="102" y1="355" x2="102" y2="155"/>
    <line x1="102" y1="155" x2="256" y2="70"/>
    
    <!-- Cross DAG Vertices -->
    <line x1="102" y1="155" x2="256" y2="256"/>
    <line x1="410" y1="155" x2="256" y2="256"/>
    <line x1="102" y1="355" x2="256" y2="256"/>
    <line x1="410" y1="355" x2="256" y2="256"/>
    <line x1="256" y1="70" x2="256" y2="256"/>
    <line x1="256" y1="442" x2="256" y2="256"/>
  </g>

  <!-- BlockDAG Outer Vertices Nodes -->
  <circle cx="256" cy="70" r="7" fill="#58f187" filter="url(#nodeGlow)"/>
  <circle cx="410" cy="155" r="7" fill="#58a6ff" filter="url(#nodeGlow)"/>
  <circle cx="410" cy="355" r="7" fill="#58f187" filter="url(#nodeGlow)"/>
  <circle cx="256" cy="442" r="7" fill="#58a6ff" filter="url(#nodeGlow)"/>
  <circle cx="102" cy="355" r="7" fill="#58f187" filter="url(#nodeGlow)"/>
  <circle cx="102" cy="155" r="7" fill="#58a6ff" filter="url(#nodeGlow)"/>

  <!-- Stylized Monogram "IM" Emblem (Central Solid Geometry) -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar (Left leg of M and vertical element of I) -->
    <path d="M 148 135 L 196 135 L 196 377 L 148 377 Z" fill="url(#emeraldGrad)"/>
    
    <!-- Central Chevrons forming the DAG convergence & M valley -->
    <!-- Left diagonal going down -->
    <path d="M 196 135 L 256 260 L 256 315 L 196 195 Z" fill="url(#cyanGrad)"/>
    
    <!-- Right diagonal going down -->
    <path d="M 316 135 L 256 260 L 256 315 L 316 195 Z" fill="url(#cyanGrad)"/>

    <!-- Right Pillar (Right leg of M) -->
    <path d="M 316 135 L 364 135 L 364 377 L 316 377 Z" fill="url(#emeraldGrad)"/>

    <!-- Central Diamond Node at DAG Convergence Point -->
    <polygon points="256,238 274,256 256,274 238,256" fill="#ffffff" filter="url(#nodeGlow)"/>
    
    <!-- Horizontal Crossbar linking the central monetary core -->
    <rect x="220" y="347" width="72" height="30" rx="6" fill="url(#cyanGrad)"/>
    <circle cx="256" cy="362" r="5" fill="#ffffff"/>
  </g>

  <!-- Upper Crown Accent (Denoting Sovereignty / Standard of Value) -->
  <circle cx="256" cy="122" r="12" fill="#58f187" filter="url(#nodeGlow)"/>
</svg>
