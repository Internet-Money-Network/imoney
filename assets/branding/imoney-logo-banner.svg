<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240">
  <!-- Clean dark card background -->
  <rect width="1100" height="240" rx="16" fill="#0f1115"/>
  <rect x="1.5" y="1.5" width="1097" height="237" rx="14.5" fill="none" stroke="#222630" stroke-width="2"/>

  <!-- Logo Mark (Left) -->
  <g transform="translate(48, 40) scale(0.3125)">
    <!-- Container -->
    <rect width="512" height="512" rx="128" fill="#15181e" stroke="#2c313d" stroke-width="6"/>
