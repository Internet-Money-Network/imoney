<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Money</title>
  <style>
    :root { --paper: #eef0e6; --ink: #0f2e23; --soft: #3d6652; --accent: #0b7a4b; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0b1f18; --ink: #e9eddc; --soft: #9db39a; --accent: #6fe0a6; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--paper); color: var(--ink); font-family: Georgia, "Iowan Old Style", serif;
           display: flex; align-items: center; justify-content: center; text-align: center; }
    h1 { font-weight: 600; font-size: 34px; margin: 22px 0 8px; }
    p { color: var(--soft); margin: 0; font-size: 17px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block;
           margin: 0 4px; animation: pulse 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <div>
    <svg width="64" height="64" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" fill="#eef0e6"/>
      <rect x="30" y="30" width="452" height="452" fill="none" stroke="#3d6652" stroke-width="5"/>
      <rect x="86" y="128" width="56" height="256" fill="#0f2e23"/>
      <path d="M182 384 L182 232 L242 128 L298 128 L238 232 L238 384 Z" fill="#0f2e23"/>
      <path d="M310 384 L310 232 L370 128 L426 128 L366 232 L366 384 Z" fill="#0f2e23"/>
      <circle cx="114" cy="94" r="16" fill="#0b7a4b"/>
    </svg>
    <h1>Getting ready</h1>
    <p>Connecting to the Internet Money network</p>
    <p style="margin-top: 18px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  </div>
</body>
</html>
