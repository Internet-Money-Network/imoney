name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use "Report a vulnerability" on the Security tab, or write to security@internetmoneynetwork.org.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Node, CPU miner, GPU miner, Pool or Stratum, Wallet, Explorer, SDK, WooCommerce plugin, Website, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit, and your operating system
      placeholder: v0.1.1, Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Include log output if there is any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
