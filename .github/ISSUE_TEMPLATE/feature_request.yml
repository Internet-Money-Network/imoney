name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: markdown
    attributes:
      value: Changes to consensus rules need a written rationale and are discussed before any code. See ROADMAP.md for what is and is not planned.
