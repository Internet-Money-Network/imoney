# One grouped pull request a month for each kind of dependency, instead of one per package.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
    # Signatures and big-number arithmetic are consensus code: upgraded by hand, with tests
    ignore:
      - dependency-name: ed25519-dalek
        update-types: ["version-update:semver-major"]
      - dependency-name: primitive-types
  - package-ecosystem: npm
    directory: /packages/imoney-sdk
    schedule:
      interval: monthly
    groups:
      sdk:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
