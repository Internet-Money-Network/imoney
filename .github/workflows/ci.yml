name: Build & Test Network Artifacts

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  rust-core-and-node:
    name: Build & Test Node Daemons & Miner
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Pinned so that lint results and builds are the same here as on developers' machines.
        # Keep in step with rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Archive Binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/release/imoney-node dist/
          cp target/release/imoney-miner dist/
          cp target/release/imoney-gpu-miner dist/
          cp target/release/imoney-stratum dist/
          cp README.md LICENSE LICENSE-APACHE dist/
          tar -czf imoney-${{ matrix.os }}.tar.gz -C dist .

      - name: Archive Binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/imoney-node.exe -Destination dist/
          Copy-Item target/release/imoney-miner.exe -Destination dist/
          Copy-Item target/release/imoney-gpu-miner.exe -Destination dist/
          Copy-Item target/release/imoney-stratum.exe -Destination dist/
          Copy-Item README.md, LICENSE, LICENSE-APACHE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath imoney-windows.zip -Force

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: |
            imoney-*.tar.gz
            imoney-*.zip

  dependency-audit:
    name: Audit Dependencies for Known Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit

  sdk-and-packages:
    name: Build & Test Developer SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build & Test SDK
        working-directory: packages/imoney-sdk
        run: |
          npm ci
          npm test

      - name: Build & Test the Swap Contract
        working-directory: contracts
        # Not `npm ci`: ganache bundles a macOS-only package that its lockfile entry does not
        # mark optional, and `npm ci` refuses it on Linux
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Check committed SDK bundles are up to date
        run: git diff --exit-code -- packages/imoney-sdk/dist plugins/imoney-payments-for-woocommerce/imoney.js

      - name: Upload Packaged WooCommerce Gateway
        uses: actions/upload-artifact@v7
        with:
          name: imoney-woocommerce-plugin
          path: plugins/imoney-payments-for-woocommerce.zip

  fuzz-smoke:
    name: Fuzz the Decoders Briefly
    # A short run of each target: catches regressions in the code that reads untrusted bytes.
    # See fuzz/README.md for long runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run each target for 45 seconds
        run: |
          for target in block_decode transaction_verify p2p_message address_decode; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45
          done

  desktop:
    name: Desktop App (${{ matrix.target }})
    # Installers take a while to build, so only for releases or when started by hand
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/imoney-desktop/src-tauri -> target
          key: desktop-${{ matrix.target }}

      - name: Linux libraries for the app window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the installers
        working-directory: apps/imoney-desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm run sidecar
          npx tauri build --target ${{ matrix.target }}

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p desktop
          bundle=apps/imoney-desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          find "$bundle" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} desktop/ \;
          ls -la desktop

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/*

  release:
    name: Publish Release
    # Pushing a tag such as v0.1.0 publishes the files built above as a GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-core-and-node, sdk-and-packages, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes --prerelease
